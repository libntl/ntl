; T047: ABI table for aarch64-linux-musl. Variant of aarch64-linux-gnu
; with musl libc. ABI properties identical.

[properties]
bits_per_long       = 64
arith_right_shift   = 1
fma_policy          = auto
long_double         = target_native
x86_specializations = false
tune_table          = generic
exec_mode           = qemu-user
exe_wrapper         = qemu-aarch64-static
shlib_style         = elf
threading           = pthread
tls_hack            = false
