; T046: ABI table for aarch64-linux-gnu.
; arith_right_shift = 1 is guaranteed on aarch64 (per the AArch64 ABI).
; long_double = target_native; aarch64 Linux glibc has 128-bit long double.
; tune_table = generic because no x86-flavored tune table applies.

[properties]
bits_per_long       = 64
arith_right_shift   = 1
fma_policy          = auto
long_double         = target_native
x86_specializations = false
tune_table          = generic
exec_mode           = qemu-user
exe_wrapper         = qemu-aarch64-static
shlib_style         = elf
threading           = pthread
tls_hack            = false
