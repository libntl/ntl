; T074: ABI table for x86_64-unknown-freebsd.
; exec_mode = cross-only: QEMU user-mode does not support FreeBSD binaries
; from a Linux host. Tests are validated on real FreeBSD runners only.

[properties]
bits_per_long       = 64
arith_right_shift   = 1
fma_policy          = auto
long_double         = target_native
x86_specializations = true
tune_table          = x86
exec_mode           = cross-only
exe_wrapper         =
shlib_style         = elf
threading           = pthread
tls_hack            = false
