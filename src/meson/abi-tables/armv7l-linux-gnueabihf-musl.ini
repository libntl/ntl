; T048: ABI table for armv7l-linux-gnueabihf-musl. 32-bit ARM with the
; hard-float ABI variant, musl libc.

[properties]
bits_per_long       = 32
arith_right_shift   = 1
fma_policy          = auto
long_double         = target_native
x86_specializations = false
tune_table          = generic
exec_mode           = qemu-user
exe_wrapper         = qemu-arm-static
shlib_style         = elf
threading           = pthread
tls_hack            = false
