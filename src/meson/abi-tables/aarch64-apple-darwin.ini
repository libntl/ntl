; T056: ABI table for aarch64-apple-darwin (Apple Silicon macOS).
; long_double = disable because long double on aarch64-apple-darwin is
; 64-bit IEEE, narrower than NTL's default assumptions (FR-009).

[properties]
bits_per_long       = 64
arith_right_shift   = 1
fma_policy          = auto
long_double         = disable
x86_specializations = false
tune_table          = generic
exec_mode           = cross-only
exe_wrapper         =
shlib_style         = dylib
threading           = pthread
tls_hack            = false
