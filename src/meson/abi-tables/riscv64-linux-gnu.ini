; T073: ABI table for riscv64-linux-gnu. Best-effort target per FR-008.

[properties]
bits_per_long       = 64
arith_right_shift   = 1
fma_policy          = auto
long_double         = target_native
x86_specializations = false
tune_table          = generic
exec_mode           = qemu-user
exe_wrapper         = qemu-riscv64-static
shlib_style         = elf
threading           = pthread
tls_hack            = false
