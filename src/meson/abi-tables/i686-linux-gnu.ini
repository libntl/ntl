; T038: ABI table for i686-linux-gnu (32-bit x86 glibc Linux).
; See specs/001-meson-cross-compile/contracts/abi-table.schema.md for schema.

[properties]
bits_per_long       = 32
arith_right_shift   = 1
fma_policy          = auto
long_double         = target_native
x86_specializations = true
tune_table          = x86
exec_mode           = qemu-user
exe_wrapper         = qemu-i386-static
shlib_style         = elf
threading           = pthread
tls_hack            = false
