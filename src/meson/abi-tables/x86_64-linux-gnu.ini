; T030: ABI table for x86_64-linux-gnu (the reference target).
; See specs/001-meson-cross-compile/contracts/abi-table.schema.md for schema.

[properties]
bits_per_long      = 64
arith_right_shift  = 1
fma_policy         = auto
long_double        = target_native
x86_specializations = true
tune_table         = x86
exec_mode          = native
exe_wrapper        =
shlib_style        = elf
threading          = pthread
tls_hack           = false
