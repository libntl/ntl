; T039: ABI table for x86_64-linux-musl (64-bit x86_64 musl Linux).
; Same arch as the native host; differs only by libc. exec_mode=native
; because the resulting binaries can run on a glibc build host as long as
; the dynamic linker (ld-musl-x86_64.so.1) is available — when it isn't,
; consumers should override exec_mode to qemu-user in their cross-file.
; See specs/001-meson-cross-compile/contracts/abi-table.schema.md for schema.

[properties]
bits_per_long       = 64
arith_right_shift   = 1
fma_policy          = auto
long_double         = target_native
x86_specializations = true
tune_table          = x86
exec_mode           = native
exe_wrapper         =
shlib_style         = elf
threading           = pthread
tls_hack            = false
