; T064: ABI table for x86_64-w64-mingw32 (Windows via MinGW-w64).
; long_double = disable: MinGW long double width is configuration-dependent
; and unreliable (FR-009).
; threading = winpthread: MinGW-w64's winpthreads.

[properties]
bits_per_long       = 64
arith_right_shift   = 1
fma_policy          = auto
long_double         = disable
x86_specializations = true
tune_table          = x86
exec_mode           = wine
exe_wrapper         = wine64
shlib_style         = dll
threading           = winpthread
tls_hack            = false
