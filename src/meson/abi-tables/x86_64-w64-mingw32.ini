; T064: ABI table for x86_64-w64-mingw32 (Windows via MinGW-w64).
;
; bits_per_long = 32 because Windows x64 uses the LLP64 ABI: long is
; 32-bit, only long long and pointers are 64-bit. This is the same
; bits-per-long the FORCE_BPL plumbing produces on MakeDesc — without
; it, every shift like (a >> (NTL_BITS_PER_LONG-1)) overflows when
; emitted for a 32-bit long.
;
; long_double = disable: MinGW long double width is configuration-
; dependent and unreliable (FR-009).
; threading = winpthread: MinGW-w64's winpthreads.

[properties]
bits_per_long       = 32
arith_right_shift   = 1
fma_policy          = auto
long_double         = disable
x86_specializations = true
tune_table          = x86
exec_mode           = wine
exe_wrapper         = wine64
shlib_style         = dll
threading           = winpthread
tls_hack            = false
