; T065: ABI table for i686-w64-mingw32 (32-bit Windows via MinGW-w64).
; Stresses the FORCE_BPL=32 path; same long-double / threading policy as
; the 64-bit variant.

[properties]
bits_per_long       = 32
arith_right_shift   = 1
fma_policy          = auto
long_double         = disable
x86_specializations = true
tune_table          = x86
exec_mode           = wine
exe_wrapper         = wine
shlib_style         = dll
threading           = winpthread
tls_hack            = false
