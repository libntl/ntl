; T055: ABI table for x86_64-apple-darwin (Intel macOS).
; long_double = disable because Apple's long double, while 80-bit on x86_64,
; behaves unreliably under cross-compiled toolchains and is not worth the
; downstream test surface (FR-009 policy: disable on all Apple).
; exec_mode = cross-only: no Linux user-mode emulator for Mach-O binaries.

[properties]
bits_per_long       = 64
arith_right_shift   = 1
fma_policy          = auto
long_double         = disable
x86_specializations = true
tune_table          = x86
exec_mode           = cross-only
exe_wrapper         =
shlib_style         = dylib
threading           = pthread
tls_hack            = false
