; Static tune table — "linux-s390x" (IBM Z mainframes).
;
; Ported from src/DoConfig:691-702 (NTL <= 11.6.0 legacy build).
; Differs from x86 in three places: SPMM_ULL=0, AVOID_BRANCHING=1,
; GF2X_NOINLINE=1, GF2X_ALTCODE1=0.

[parameters]
NTL_SPMM_ULL          = 0
NTL_AVOID_BRANCHING   = 1
NTL_FFT_BIGTAB        = 1
NTL_FFT_LAZYMUL       = 1
NTL_TBL_REM           = 1
NTL_CRT_ALTCODE       = 1
NTL_CRT_ALTCODE_SMALL = 0
NTL_GF2X_NOINLINE     = 1
NTL_GF2X_ALTCODE      = 0
NTL_GF2X_ALTCODE1     = 0
