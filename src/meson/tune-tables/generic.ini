; Static tune table — "generic" (safe defaults for unknown architectures).
;
; Ported from src/DoConfig:658-674 (NTL <= 11.6.0 legacy build).
; Quoting the legacy comment: "the default values are set to ensure
; reasonably good performance across a wide range of architectures,
; but it's better to run the Wizard. Here, I don't want to assume a
; cmov-like instruction, so we set AVOID_BRANCHING to be on the safe
; side."
;
; This file is checked in. Do not auto-generate it — that's what
; `host-tuned.ini` is for (Wizard output, gitignored by default).

[parameters]
NTL_SPMM_ULL          = 1
NTL_AVOID_BRANCHING   = 1
NTL_FFT_BIGTAB        = 1
NTL_FFT_LAZYMUL       = 1
NTL_TBL_REM           = 1
NTL_CRT_ALTCODE       = 1
NTL_CRT_ALTCODE_SMALL = 0
NTL_GF2X_NOINLINE     = 0
NTL_GF2X_ALTCODE      = 0
NTL_GF2X_ALTCODE1     = 1
