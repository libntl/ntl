; Static tune table — "x86" family (modern x86_64 / amd64).
;
; Ported from src/DoConfig:675-690 (NTL <= 11.6.0 legacy build).
; Legacy comment: "these settings should work pretty well across x86's;
; the most important assumption is that we have the cmov instruction."

[parameters]
NTL_SPMM_ULL          = 1
NTL_AVOID_BRANCHING   = 0
NTL_FFT_BIGTAB        = 1
NTL_FFT_LAZYMUL       = 1
NTL_TBL_REM           = 1
NTL_CRT_ALTCODE       = 1
NTL_CRT_ALTCODE_SMALL = 0
NTL_GF2X_NOINLINE     = 0
NTL_GF2X_ALTCODE      = 0
NTL_GF2X_ALTCODE1     = 1
